name: Nifty150 live signals

on:
  schedule:
    # Cron is in UTC. NSE session 09:15-15:30 IST = 03:45-10:00 UTC, Mon-Fri.
    # The 10:15/10:30 UTC runs (15:45/16:00 IST) pick up the final bars,
    # since Yahoo data lags ~15 min. GitHub may start runs a few minutes late.
    - cron: "45 3 * * 1-5"
    - cron: "0,15,30,45 4-9 * * 1-5"
    - cron: "0,15,30 10 * * 1-5"
  workflow_dispatch:  # "Run workflow" button for manual tests
    inputs:
      test_telegram:
        description: "Only send a Telegram test message (checks the secrets)"
        type: boolean
        default: false
      full_scan:
        description: "Run a full scan now, even outside market hours (refreshes the dashboard)"
        type: boolean
        default: false

concurrency:
  group: live-signals
  cancel-in-progress: false  # never run two scans at once (shared state)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dashboard: ${{ steps.site.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # signal_state.json carries each stock's last state between runs, so a
      # signal only alerts when it changes; bars_cache.pkl holds the 15-min bar
      # history so only the first scan of a day downloads 15 days and later
      # scans fetch just today's bars. Every run saves a new cache entry;
      # restore-keys picks up the most recent one.
      - uses: actions/cache@v4
        with:
          path: |
            signal_state.json
            bars_cache.pkl
          key: signal-state-${{ github.run_id }}
          restore-keys: signal-state-

      - name: Scan and send alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u nifty150_live_signals.py ${{ inputs.test_telegram && '--test-telegram' || (inputs.full_scan && '--test' || '--once') }}

      # The scan (or, outside market hours, the last saved state) writes
      # dashboard.html. It is published to GitHub Pages only in encrypted form
      # (StatiCrypt, unlocked with the DASHBOARD_PASSWORD secret); without that
      # secret nothing is published. The salt is fixed so "Remember me" keeps
      # working across the 15-minute redeploys — it isn't secret.
      - name: Encrypt dashboard
        id: site
        if: ${{ !inputs.test_telegram && hashFiles('dashboard.html') != '' }}
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$DASHBOARD_PASSWORD" ]; then
            echo "::warning::DASHBOARD_PASSWORD secret not set — dashboard not published"
            exit 0
          fi
          mkdir -p site
          cp dashboard.html site/index.html
          npx --yes staticrypt@3 site/index.html -p "$DASHBOARD_PASSWORD" \
            -s 377a6f269badd7ffccacac9db8e9ed1b --config false -d public --short --remember 30 \
            --template-title "Technical Dashboard" \
            --template-instructions "Enter the dashboard password." \
            --template-button "Unlock" \
            --template-color-primary "#111827" --template-color-secondary "#f4f5f7"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.ready == 'true'
        with:
          path: public

  publish:
    needs: scan
    if: needs.scan.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
